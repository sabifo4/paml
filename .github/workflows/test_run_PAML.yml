name: Running PAML

on:
  # Trigger action manually
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: '30 15 * * 1'
      timezone: "Europe/London"
    
jobs:
  compile:
    # Call reusable workflow for compilation
    uses: ./.github/workflows/compile.yml
  run-paml:
    # Tests to run PAML program rely on programs being successfully compiled
    needs: compile
    strategy:
      # Same matrix as in `compile.yml`
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
        compiler: [gcc, clang]
        # MacOS needs the compiler version, does not work with just 'latest'
        # Windows will have its own environment and compiler, should be
        # added separately
        include:
            - { os: macos-latest,   compiler: gcc-15 }
            - { os: macos-15-intel, compiler: gcc-15 }
            - { os: windows-latest }
            - { os: windows-11-arm }
        exclude:
            - { os: macos-latest,   compiler: gcc }
            - { os: macos-15-intel, compiler: gcc }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Download Windows PAML binaries
        if: startsWith(matrix.os, 'windows')
        uses: actions/download-artifact@v8
        with:
          name: paml-binaries-${{ matrix.os }}-cl
          path: bin
      - name: Download Linux PAML binaries
        if: startsWith(matrix.os, 'ubuntu')
        uses: actions/download-artifact@v8
        with:
          name: paml-binaries-${{ matrix.os }}-${{ matrix.compiler }}
          path: bin
      - name: Download MacOS PAML binaries
        if: startsWith(matrix.os, 'macos')
        uses: actions/download-artifact@v8
        with:
          name: paml-binaries-${{ matrix.os }}-${{ matrix.compiler }}
          path: bin
      - name: Run PAML on Linux and MacOS
        id: run-mcmctree-lin-unix
        shell: bash
        if: ${{ startsWith(matrix.os, 'ubuntu') || startsWith(matrix.os, 'macos') }}
        run: |
            # Run PAML programs
            chmod +x ./bin/*
            cd ./test/
            for program in *; do
                program="${program%/}"
                echo "Tests with PAML program $program"
                cd "$program"
                for i in *.ctl; do
                    name=$( echo "$i" | sed 's/..*_//' )
                    printf "\nTest: %s\n" "$name"
                    ../../bin/$program "$i"
                done
                if [[ "$program" == "ds" ]]; then
                  for i in ds_test*txt; do
                    ../../bin/$program "$i"
                  done
                fi
                cd ..
            done
      - name: Run MCMCtree on Windows
        id: run-mcmctree-win
        shell: cmd
        if: ${{ startsWith(matrix.os, 'windows') }}
        run: |
            # Run MCMCtree with cross-bracing example
            setlocal enabledelayedexpansion
            set "failed=0"

            cd .\test
            for /d %%p in (*) do (
              echo Tests with PAML program %%p
              pushd "%%p"
              for %%i in (*.ctl) do (
                call :getname "%%~nxi"
                echo.
                echo Test: !name!
                ..\..\bin\%%p.exe "%%i"
                if errorlevel 1 ( echo ##[error] FAILED: %%p on %%i & set "failed=1" )
              )
              if /i "%%p"=="ds" (
                for %%t in (ds_test*txt) do (
                  ..\..\bin\ds.exe "%%t"
                  if errorlevel 1 ( echo ##[error] FAILED: ds on %%t & set "failed=1" )
                )
              )
              popd
            )
            if "!failed!"=="1" ( echo One or more PAML tests failed. & exit /b 1 )
            echo All PAML tests passed.
            exit /b 0

            :getname
            set "name=%~1"
            :_strip
            if not "!name!"=="!name:*_=!" ( set "name=!name:*_=!" & goto _strip )
            exit /b
