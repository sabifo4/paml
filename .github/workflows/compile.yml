name: Compiling PAML

on:
  # Trigger action manually
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: '30 15 * * 1'
      timezone: "Europe/London"
    
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest, macos-15-intel]
        compiler: [gcc, clang]
        # MacOS needs the compiler version, does not work with just 'latest'
        include:
            - { os: macos-latest,   compiler: gcc-15 }
            - { os: macos-15-intel, compiler: gcc-15 }
        exclude:
            - { os: macos-latest,   compiler: gcc }
            - { os: macos-15-intel, compiler: gcc }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        # Clone the repo so that the rest of actions can run
        uses: actions/checkout@v7
      - name: Compile PAML on Windows
        id: cc-win
        if: ${{ startsWith(matrix.os, 'windows') }}
        shell: bash
        run: |
          # Check if `make` exists, install otherwise
          if command -v make >/dev/null 2>&1; then
            echo "'make' is already available!"
          else
            echo "'make' not found, installing... ..."
            choco install make -y
          fi
          cd src
          echo Compiling with ${{ matrix.compiler }}
          nmake -f Makefile.VC CC=${{ matrix.compiler }}
          if ls *.o >/dev/null 2>&1; then
            echo 'Compilation finished, removing output files'
            rm -f *.o
          fi
      - name: Compile PAML on Linux and Unix
        id: cc-lin-unix
        if: ${{ startsWith(matrix.os, 'macos') || startsWith(matrix.os, 'ubuntu') }}
        shell: bash
        run: |
          cd src
          if [[ "${{ matrix.compiler }}" =~ "clang" && "${{ matrix.os }}" =~ "ubuntu" ]]; then
            if command -v clang >/dev/null 2>&1; then
              echo "'clang' is already available!"
            else
              echo "'clang' not found, installing... ..."
              sudo apt-get update && sudo apt-get install -y clang
            fi
          fi
          echo Compiling with ${{ matrix.compiler }}
          make -f Makefile CC=${{ matrix.compiler }}
          if ls *.o >/dev/null 2>&1; then
            echo 'Compilation finished, removing output files'
            rm -f *.o
          fi
